# Adapted from AstrBot issue templates; customized for Afterglow Desktop.
# https://github.com/AstrBotDevs/AstrBot/tree/master/.github/ISSUE_TEMPLATE
name: "功能建议（中文）"
description: "帮助改进 Afterglow Desktop。"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "请先搜索已有 Issue。本仓库用于桌面程序；涉及原版核心时请关联对应问题。请勿公开凭据或私人聊天记录。"
  - type: textarea
    id: proposal
    attributes:
      label: "功能建议"
      description: "说明希望增加的功能及其解决的问题。"
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: "使用场景与替代方案"
      description: "你会如何使用？目前尝试过哪些方法？"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: "提交前确认"
      options:
        - label: "我已搜索已有问题，并移除了本报告中的敏感信息。"
          required: true
        - label: "我愿意参与提交 PR（可选）。"
