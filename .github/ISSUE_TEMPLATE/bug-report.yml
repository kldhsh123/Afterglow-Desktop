# Adapted from AstrBot issue templates; customized for Afterglow Desktop.
# https://github.com/AstrBotDevs/AstrBot/tree/master/.github/ISSUE_TEMPLATE
name: "报告问题（中文）"
description: "帮助改进 Afterglow Desktop。"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "请先搜索已有 Issue。本仓库用于桌面程序；涉及原版核心时请关联对应问题。请勿公开凭据或私人聊天记录。"
  - type: textarea
    id: problem
    attributes:
      label: "发生了什么？"
      description: "描述实际表现和预期行为。"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "复现步骤"
      description: "列出操作步骤；需要示例时请使用虚构数据。"
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: "桌面端与核心版本"
      description: "填写“组件与更新”中的桌面端和核心版本；未安装核心请注明。"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Windows 版本与安装方式"
      description: "例如 Windows 11 x64、安装版或便携版；路径有关时请提供脱敏后的路径。"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "日志或截图（可选）"
      description: "提供相关的脱敏诊断；请移除密钥、令牌、个人信息及私人聊天内容，不要上传完整聊天导出。"
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: "提交前确认"
      options:
        - label: "我已搜索已有问题，并移除了本报告中的敏感信息。"
          required: true
        - label: "我愿意参与提交 PR（可选）。"
